[tool.poetry]
name = "oca_monitor"
version = "0.4.21" # Also change the version in oca_monitor_bases.py
description = "Flexible GUI for displaying telescopes and other OCM systems status"
license = "MIT"
authors = ["pwielgorski"]
readme = "README.md"
include = ["settings.toml", "oca_monitor/resources/icons/*"]


[tool.poetry.dependencies]
python = "^3.11, <3.14"
#paho-mqtt = "^1.6.1"

# PyQt6 wheels exist for ARM64 only from 6.8.0 up, and they are tagged
# manylinux_2_39 -> glibc >= 2.39. Raspberry Pi OS Bookworm has glibc 2.36,
# so pip/poetry would fall back to the sdist and try to build Qt (hopeless).
# Hence: on ARM the marker skips pyqt6 (and pyqt6-qt6/pyqt6-sip with it) and
# the app uses the distro bindings instead -- see "Installing on Raspberry PI"
# in README.md. Everywhere else it installs from PyPI as usual.
pyqt6 = {version = "^6.8", markers = "platform_machine != 'aarch64' and platform_machine != 'armv7l' and platform_machine != 'armv6l'"}
opencv-python = "*"
astropy = "^7.0"   # 6.x calls np.in1d which numpy 2.4+ removed
matplotlib = "*"
requests = "^2.33.1"
serverish = {version="^2.0.5", extras=["messenger"]}
qasync = "^0.28.0"
dynaconf = "3.2.13"
aiofiles = "^25.1.0"
aiohttp = "^3.13.5"
numpy = [
  { version = "^2.4.4", python = ">=3.11" },
  { version = "^1.26", python = ">=3.10,<3.11" }
]
pyaraucaria = "^2.13.0"
mloca = {git = "https://github.com/araucaria-project/mloca.git"}


[tool.poetry.scripts]
ocam_old = "oca_monit:main"
ocam = "oca_monitor.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
