# All settings can be overriden by environment variables with the same name and prefix OCAMONITOR_
# e.g. OCAMONITOR_NATS_HOST=test.oca.lan

#---------------------------default - controlroom---------------------

[default]  # global configuration is used by all environments, setting from here override all other settings
window_size = [1910, 1040]
#window_size = [1800, 1000]
panel_columns = [4,4,3]  # The size ratio of the columns in the panel grid
panel_rows = [5,1]   # The size ratio of the rows in the panel grid
style = "dark"
#style = "white"

nats_host = "nats.oca.lan"
nats_port = 4222

#log_level = "DEBUG"
log_level = "INFO"
#log_level = "WARNING"

[default.panels.00.Radar]
source = "radar"  # page source - page is defined in oca_monitor/pages/radar.py


[default.panels.10.Message]
source = "message"  # page source - page is defined in oca_monitor/pages/example.py

[default.panels.01.Clouds]
source = "allsky_animation_mpl"
vertical_screen = 0
# clouds from allsky_overwatch drawn on the frames: yellow outline = cirrus / semi-transparent / uncertain, red outline =
# cloud that hides everything, dashed yellow circle = a veil over the whole sky, cyan = Moon; in twilight (Sun above
# -18 deg) the Moon only

# the plain allsky frames (telescopes and wind only), for when the cloud marks are wrong; out of the rotation
[default.panels.01.Allsky]
source = "allsky_animation_mpl"  # page source - page is defined in oca_monitor/pages/example.py
#source = "allsky_animation"  # the non-matplotlib variant
vertical_screen = 0
clouds = false
auto_enabled = false

# the two method pictures of allsky_overwatch (pages/allsky_method.py), out of the rotation (auto_enabled = false);
# switch them on in the panel's config dialog
[default.panels.01.CloudsDiff]
source = "allsky_method"
kind = "diff"
auto_enabled = false

[default.panels.01.CloudsStars]
source = "allsky_method"
kind = "stars"
auto_enabled = false

[default.panels.01.Satellite]
source = "satellite_animation"  # page source - page is defined in oca_monitor/pages/example.py
vertical_screen = 0

[default.panels.11.Telescopes]
source = "telescopes"  # page source - page is defined in oca_monitor/pages/example.py

[default.panels.02.Weather]
source = "weather"  # page source - page is defined in oca_monitor/pages/example.py
vertical_screen = 0

charts = ["wind", "temperature", "humidity_pressure", "power"]

# sky quality, in the rotation with Weather: clouds from the allsky camera (allsky_overwatch), photometric zero point, seeing
[default.panels.02.Sky]
source = "weather"
vertical_screen = 0
charts = ["clouds", "phot_zero", "fwhm"]
permanent_wind = false


[default.panels.12.Site]
source = "site_status"  # unified clocks + sun/moon events + water level


#---------------------------monitor2 - additional controlroom screen (2026-11-12, layout being tried)---------------------
# poetry run ocam --env monitor2
# 00 system health                        | 01 weather charts | 02 radar
# 10 power / water / internet             | 11 battery / water level (rotating)                      | 12 telescopes

[monitor2]
window_size = [1910, 1040]
panel_columns = [5,6,9]  # radar column ~ as wide as the top row is high (radar is round); 2026-11-12
panel_rows = [4,1]   # The size ratio of the rows in the panel grid
style = "dark"

nats_host = "nats.oca.lan"
nats_port = 4222

log_level = "INFO"

[monitor2.panels.00.Health]
source = "health"  # system health: site data, overwatches, services, telescopes (pages/health.py)
# 2026-11-14: only the three big tiles INTERNET / ROUTER / NATS; details = true brings back the full lists
details = false
#router_host = "192.168.7.1"
#internet_hosts = ["google.com", "yahoo.com", "camk.edu.pl", "1.1.1.1"]

[monitor2.panels.01.Weather]
source = "weather"
vertical_screen = 0
charts = ["wind", "temperature", "humidity_pressure"]
show_time = false   # no LT / Sun / UT strip above the charts

[monitor2.panels.02.Radar]
source = "radar"

[monitor2.panels.10.Utilities]
source = "utilities"  # battery, solar / load, water level, internet uplink

[monitor2.panels.11.Battery]
source = "weather"
vertical_screen = 0
charts = ["power"]
permanent_wind = false
show_time = false
show_values = false   # no big numbers over the chart - they are in Utilities next to it
compact_panel = true  # panel 11 rotates Battery / Water without the tab bar and Play / Stop buttons

[monitor2.panels.11.Water]   # rotates with Battery (auto_interval 10 at panel speed 20 = 20 s each)
source = "weather"
vertical_screen = 0
charts = ["water"]
permanent_wind = false
show_time = false

[monitor2.panels.12.Telescopes]
source = "telescopes"


#---------------------------monitor3 - additional controlroom screen (2026-11-12)---------------------
# poetry run ocam --env monitor3
# 00 satellite          | 01 clouds (+ allsky, diff, stars out of the rotation) | 02 sky: clouds, zero point, fwhm
# 10 events (overwatch) | 11 messages (plays the alarm sounds!)                 | 12 site: time, Sun, Moon

[monitor3]
window_size = [1910, 1040]
panel_columns = [4,4,3]  # as default
panel_rows = [5,1]
style = "dark"

nats_host = "nats.oca.lan"
nats_port = 4222

log_level = "INFO"

[monitor3.panels.00.Satellite]
source = "satellite_animation"
vertical_screen = 0

[monitor3.panels.01.Clouds]
source = "allsky_animation_mpl"
vertical_screen = 0

[monitor3.panels.01.Allsky]
source = "allsky_animation_mpl"
vertical_screen = 0
clouds = false
auto_enabled = false

[monitor3.panels.01.CloudsDiff]
source = "allsky_method"
kind = "diff"
auto_enabled = false

[monitor3.panels.01.CloudsStars]
source = "allsky_method"
kind = "stars"
auto_enabled = false

[monitor3.panels.02.Sky]
source = "weather"
vertical_screen = 0
charts = ["clouds", "phot_zero", "fwhm"]
permanent_wind = false

[monitor3.panels.10.Events]
source = "events"   # conditions_overwatch events (the engine of TOI's Events tab), pages/events.py

[monitor3.panels.11.Message]
source = "message"  # also plays the sounds - run it on one screen of a room only

[monitor3.panels.12.Site]
source = "site_status"
show_events = false   # events: panel 10
show_water = false
show_net = false


